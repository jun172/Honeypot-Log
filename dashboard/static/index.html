<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';"
  />
  <title>Honeypot Monitor</title>
  <link rel="icon" type="image/png" href="/static/AIWeb.png" />
  <link rel="apple-touch-icon" href="/static/AIWeb.png?v=1" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="live-dot" class="pulse-dot" aria-hidden="true"></span>
      <h1>HONEYPOT MONITOR</h1>
      <span id="stream-badge" class="badge badge-success">LIVE</span>
      <nav class="nav-links" aria-label="Page navigation">
        <a href="/" class="nav-link active" aria-current="page" data-i18n="nav_dashboard">ログ</a>
        <a href="/environment" class="nav-link" data-i18n="nav_env">構成</a>
      </nav>
    </div>

    <div class="controls">
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button id="lang-ja-btn" type="button" class="lang-btn active" aria-pressed="true">日本語</button>
        <button id="lang-en-btn" type="button" class="lang-btn" aria-pressed="false">EN</button>
      </div>

      <select id="hours-select" aria-label="Period">
        <option value="1" data-i18n="period_1h">1時間</option>
        <option value="6" data-i18n="period_6h">6時間</option>
        <option value="24" data-i18n="period_24h">24時間</option>
        <option value="168" data-i18n="period_168h">7日間</option>
        <option value="8760" selected data-i18n="period_all">全期間</option>
      </select>

      <select id="limit-select" aria-label="Limit">
        <option value="200" data-i18n="limit_200">200件</option>
        <option value="1000" data-i18n="limit_1000">1,000件</option>
        <option value="2000" selected data-i18n="limit_2000">2,000件</option>
        <option value="10000" data-i18n="limit_10000">10,000件</option>
      </select>

      <button id="toggle-stream-btn" type="button" data-i18n="pause_btn">停止</button>
      <button id="refresh-btn" type="button" data-i18n="refresh_btn">更新</button>
      <a id="export-log-btn" class="ghost-link" href="/api/export/log.txt" download="log.txt">.txt</a>
      <a id="export-jsonl-btn" class="ghost-link" href="/api/export/attacks.jsonl" download="detected_attacks.jsonl">.jsonl</a>
      <span id="last-updated" class="muted" role="status" aria-live="polite" data-i18n="connecting">接続中...</span>
    </div>
  </header>

  <main class="container">
    <section class="kpi-grid" aria-label="Key metrics">
      <div class="card">
        <div class="kpi-label" data-i18n="kpi_total">検知件数</div>
        <div id="kpi-total" class="kpi-value">0</div>
      </div>
      <div class="card">
        <div class="kpi-label" data-i18n="kpi_ips">ユニークIP</div>
        <div id="kpi-ips" class="kpi-value">0</div>
      </div>
      <div class="card">
        <div class="kpi-label" data-i18n="kpi_anomaly">高異常度 (≥80%)</div>
        <div id="kpi-anomaly" class="kpi-value danger-text">0</div>
      </div>
      <div class="card">
        <div class="kpi-label" data-i18n="kpi_cost">推定月額コスト</div>
        <div id="kpi-cost" class="kpi-value accent-text">$0.00</div>
      </div>
    </section>

    <section class="card" aria-label="Observed countries">
      <div id="country-flags-list" role="region" aria-label="Observed countries and flags"></div>
    </section>

    <section class="card timeline-card" aria-label="Attack logs">
      <div class="card-header">
        <div class="filter-controls">
          <label for="ip-search-input" class="visually-hidden" data-i18n="search_placeholder">検索</label>
          <input
            id="ip-search-input"
            type="text"
            maxlength="200"
            placeholder="IP・国・内容で検索..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="clear-search-btn" type="button" data-i18n="clear_btn">クリア</button>
          <span id="filter-count" class="muted"></span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" data-i18n="th_time">時刻</th>
              <th scope="col" data-i18n="th_source">送信元</th>
              <th scope="col" data-i18n="th_anomaly">異常度</th>
              <th scope="col" data-i18n="th_payload">攻撃内容</th>
            </tr>
          </thead>
          <tbody id="timeline-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
